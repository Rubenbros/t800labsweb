name: Deploy to Cloud Run

# ─────────────────────────────────────────────────────────────────────────────
# TRANSICIÓN A CLOUD BUILD (2026-09-09)
#
# El despliegue se está moviendo a Cloud Build (`cloudbuild.yaml` en la raíz). Este
# workflow sigue ACTIVO a propósito: los disparadores de Cloud Build todavía no
# existen, así que si se desactivara al fusionar habría una ventana sin despliegue
# ninguno. El apagado es por variable de repositorio, no por mover el fichero:
#
#   gh variable set DEPLOY_VIA_CLOUD_BUILD --body true
#
# El orquestador pondrá esa variable a 'true' EN CUANTO el primer build de Cloud
# Build pase en verde. A partir de ese momento este workflow no hace nada (el job
# se salta entero) y el fichero se puede borrar junto con la federación de
# identidad (WIF) y la cuenta `github-deployer`. Mientras la variable no exista o
# no valga 'true', despliega este workflow y NO debe existir a la vez un disparador
# de Cloud Build sobre `main`, o habría dos despliegues compitiendo.
# ─────────────────────────────────────────────────────────────────────────────
#
# Despliegue de producción a Google Cloud Run (europe-west1).
# Aplica el esquema de la base de datos y luego construye y despliega la imagen.
# Requiere que el runbook de primer despliegue haya creado: repo de Artifact
# Registry, Service Accounts (deploy y runtime), Workload Identity Federation,
# la instancia de Cloud SQL `t800labs-pg` y los secretos en Secret Manager
# (DEMO_API_KEY, DATABASE_URL).
#
# Secretos de GitHub necesarios:
#   DATABASE_URL_CI  URL de la BD a través del proxy del runner
#                    (postgresql://t800labsweb_app:PASS@127.0.0.1:5432/t800labsweb)
# La SA de despliegue necesita `roles/cloudsql.client` para levantar el proxy.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch: {}

# WIF (OIDC) necesita id-token; checkout necesita contents.
permissions:
  contents: read
  id-token: write

# No solapar despliegues del mismo servicio; encola sin cancelar el que corre.
concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  GCP_REGION: europe-west1
  AR_HOST: europe-west1-docker.pkg.dev
  SERVICE: t800labsweb
  CLOUDSQL_INSTANCE: t800labsweb:europe-west1:t800labs-pg
  CLOUDSQL_PROXY_VERSION: v2.20.0

jobs:
  deploy:
    # Interruptor de apagado: cuando el despliegue lo haga Cloud Build, basta con
    # poner la variable de repositorio DEPLOY_VIA_CLOUD_BUILD a 'true' para que este
    # job deje de ejecutarse, sin tocar el repositorio ni el historial.
    if: vars.DEPLOY_VIA_CLOUD_BUILD != 'true'
    runs-on: ubuntu-latest
    # Entorno de GitHub 'production' (permite añadir reglas de aprobación luego).
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar en GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Instalar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Node para el esquema de la base de datos
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Arrancar Cloud SQL Auth Proxy
        run: |
          set -euo pipefail
          curl -fsSL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${CLOUDSQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          # Usa las credenciales de WIF exportadas por google-github-actions/auth.
          ./cloud-sql-proxy "${CLOUDSQL_INSTANCE}" --port 5432 --health-check &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9090/startup > /dev/null; then
              echo "Proxy listo"
              exit 0
            fi
            sleep 1
          done
          echo "El Cloud SQL Auth Proxy no arrancó a tiempo" >&2
          exit 1

      - name: Aplicar el esquema (db:schema)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts
          npm run db:schema

      - name: Login de Docker en Artifact Registry
        run: gcloud auth configure-docker "${AR_HOST}" --quiet

      - name: Build y push de la imagen
        run: |
          set -euo pipefail
          IMAGE="${AR_HOST}/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${SERVICE}"
          # Este proyecto no tiene NEXT_PUBLIC_*: no hacen falta build args.
          docker build \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Desplegar en Cloud Run
        run: |
          set -euo pipefail
          # El correo sale por la API de Gmail con delegación de dominio: la SA de
          # runtime necesita `roles/iam.serviceAccountTokenCreator` sobre mailer@.
          gcloud run deploy "${SERVICE}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --image "${IMAGE}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --port 8080 \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --allow-unauthenticated \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 80 \
            --timeout 60 \
            --cpu-boost \
            --add-cloudsql-instances "${CLOUDSQL_INSTANCE}" \
            --set-env-vars "NODE_ENV=production,MAILER_SERVICE_ACCOUNT=mailer@t800labsweb.iam.gserviceaccount.com,GMAIL_SENDER=admin@t800labs.com,MAIL_FROM=T800 Labs <admin@t800labs.com>,CONTACT_TO=admin@t800labs.com" \
            --set-secrets "DEMO_API_KEY=DEMO_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest"

      - name: URL del servicio
        run: |
          gcloud run services describe "${SERVICE}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${GCP_REGION}" \
            --format 'value(status.url)'
